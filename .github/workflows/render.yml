
name: Render Moon Explainer Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install --upgrade pip
          pip install manim

      - name: Render video
        run: |
          manim -ql main.py MoonExplainer

      - name: Upload MP4 video
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Explainer-Video
          path: media/videos/main/480p15/MoonExplainer.mp4
